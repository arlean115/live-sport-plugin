name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /root/nuvio-live-sports

            echo "==> Resetting any broken merge state..."
            git reset --hard HEAD

            echo "==> Recording lockfile hash BEFORE pull..."
            LOCK_BEFORE="$(md5sum package-lock.json 2>/dev/null | awk '{print $1}')"

            echo "==> Pulling latest changes from main..."
            git pull origin main

            LOCK_AFTER="$(md5sum package-lock.json 2>/dev/null | awk '{print $1}')"

            # Native-module safety.
            #
            # This step used to run `npm install` on EVERY deploy, with the app
            # live. npm install re-extracts native binaries, and the running
            # workers have them memory-mapped (impit's *.node is loaded from
            # node_modules/impit-linux-x64-gnu/). Replacing a mapped file under a
            # live process raises SIGBUS, which kills the worker instantly with no
            # JS stack - so nothing appears in the app logs and the uncaughtException
            # handler never runs.
            #
            # Verified on the VPS: every SIGBUS in ~/.pm2/pm2.log landed 40-50s
            # after a push, i.e. during npm install, and the two workers died in the
            # same second because they share the same file.
            #
            # So: only install when the lockfile actually changed, and when it did,
            # stop the app first so nothing holds the old binary mapped.
            if [ "$LOCK_BEFORE" != "$LOCK_AFTER" ]; then
              echo "==> package-lock.json changed -> installing dependencies"
              echo "    (stopping the app first so no worker holds a mapped .node file)"
              pm2 stop nuvio-sports || true

              echo "==> Installing dependencies (sharp is required for raster posters)..."
              npm install --no-audit --no-fund

              echo "==> Building distribution bundle..."
              npm run build

              echo "==> Starting PM2 cluster..."
              pm2 start nuvio-sports
            else
              echo "==> package-lock.json unchanged -> skipping npm install"
              echo "    (avoids rewriting mapped native modules; no SIGBUS risk)"
              npm run build
              echo "==> Reloading PM2 cluster with zero downtime..."
              pm2 reload nuvio-sports
            fi

            echo "==> Deployment complete!"
            echo "==> Health:"
            curl -s -o /dev/null -w '    manifest http=%{http_code} in %{time_total}s\n' http://127.0.0.1:7000/manifest.json || true
